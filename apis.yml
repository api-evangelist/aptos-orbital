name: Aptos Orbital
description: >-
  Aptos Orbital (legal entity Cryptosat, Inc.) is a space technology company,
  founded in 2021 and backed by the Techstars Space Accelerator, that builds
  integrated hardware for satellites and spacecraft. Its flagship Aptos Terminal
  combines space-hardened, radiation-tolerant edge compute (with proprietary
  SEU/SEL protection), persistent global satellite communications, and cloud
  connectivity to platforms such as AWS and Azure into a single device. The
  company advertises 5.5+ years of proven orbital operation, 99% global data
  coverage, and TRL9 readiness for LEO applications, with development licenses,
  engineering models, and flight models offered to spacecraft builders. Aptos
  Orbital was added to the API Evangelist network as a Techstars portfolio lead;
  as of this pass the company publishes hardware brochures and a "start
  developing" onboarding form but no public API, SDK, developer portal, or
  machine-readable specification.
